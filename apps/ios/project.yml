name: RafayPair
options:
  bundleIdPrefix: com.rafaypair
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
configs:
  Debug: debug
  Development: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SUPPORTS_MACCATALYST: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  RafayPair:
    type: application
    platform: iOS
    sources:
      - path: RafayPair
    configFiles:
      Debug: Config/Debug.xcconfig
      Development: Config/Development.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaypair.app
        INFOPLIST_FILE: RafayPair/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RafayPair/Resources/RafayPair.entitlements
        PRODUCT_NAME: RafayPair
    preBuildScripts:
      - name: Validate production App Attest signing configuration
        script: /bin/sh "$SRCROOT/scripts/validate-release-app-attest.sh"
        inputFiles:
          - $(SRCROOT)/scripts/validate-release-app-attest.sh
        basedOnDependencyAnalysis: false
  RafayPairTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RafayPairTests
    dependencies:
      - target: RafayPair
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaypair.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RafayPair.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RafayPair"
        BUNDLE_LOADER: "$(TEST_HOST)"
  RafayPairUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RafayPairUITests
    dependencies:
      - target: RafayPair
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rafaypair.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RafayPair:
    build:
      targets:
        RafayPair: all
        RafayPairTests: [test]
        RafayPairUITests: [test]
    run:
      config: Development
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RafayPairTests
        - RafayPairUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
