name: rafay-pair

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: rafay_pair
      POSTGRES_USER: rafay_pair
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafay_pair -d rafay_pair"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.4.2-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rafay-pair-local
      MINIO_ROOT_PASSWORD: local-minio-password-change-before-shared-use
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rafay-pair-api:local
    command: ["node", "apps/api/dist/migrate.js"]
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://rafay_pair:local-development-only@postgres:5432/rafay_pair?sslmode=disable
      DATABASE_CA_CERT_PATH: ""
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rafay-pair-api:local
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://rafay_pair:local-development-only@postgres:5432/rafay_pair?sslmode=disable
      DATABASE_CA_CERT_PATH: ""
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mail:1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../../.env.local
    environment:
      DATABASE_URL: postgresql://rafay_pair:local-development-only@postgres:5432/rafay_pair?sslmode=disable
      DATABASE_CA_CERT_PATH: ""
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mail:1025
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  object-data:
