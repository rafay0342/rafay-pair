name: rafaypair-prod

# A single-host deployment.
#
# The Terraform stack under infra/terraform is the managed-cloud target; this
# file is for running the same images on one VPS, which is what a project has
# before it has an account with a cloud provider. Everything binds to loopback
# and is reached through the host's nginx, so the only ports open to the
# internet are 80 and 443, terminated with a real certificate.
#
# The database and Redis are not exposed to the host network at all: nothing
# outside this compose network needs them, and a bound port is a port someone
# can find.

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: rafay_pair
      POSTGRES_USER: rafay_pair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafay_pair -d rafay_pair"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.4.2-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Outbound mail is captured rather than delivered. A verification email that
  # silently vanishes into a misconfigured relay is worse than one that is
  # visibly held here until a real SMTP service is configured.
  mail:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rafaypair-api:vps
    command: ["node", "apps/api/dist/migrate.js"]
    env_file:
      - ./vps.env
    environment:
      DATABASE_CA_CERT_PATH: ""
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: rafaypair-api:vps
    env_file:
      - ./vps.env
    environment:
      DATABASE_CA_CERT_PATH: ""
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3300}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: rafaypair-worker:vps
    env_file:
      - ./vps.env
    environment:
      DATABASE_CA_CERT_PATH: ""
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
