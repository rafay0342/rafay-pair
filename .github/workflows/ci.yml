name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "11.20.0"

jobs:
  server:
    name: API, worker, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: rafay_pair_test
          POSTGRES_USER: rafay_pair
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rafay_pair -d rafay_pair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rafay_pair:test-only-password@127.0.0.1:5432/rafay_pair_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_PEPPER: ci-session-pepper-with-at-least-32-characters
      EMAIL_TOKEN_PEPPER: ci-email-pepper-with-at-least-32-characters
      PUBLIC_WEB_ORIGIN: http://127.0.0.1:4173
      ALLOWED_ORIGINS: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # The camera/microphone reachability invariant spans all three
      # clients and the server, so it runs once here rather than inside
      # any one client's suite.
      - run: pnpm run verify:invariants
      - run: pnpm --filter './packages/*' --filter './services/*' lint
      - run: pnpm --filter './packages/*' --filter './services/*' typecheck
      - run: pnpm --filter './packages/*' --filter './services/*' test
      - run: pnpm --filter @rafay-pair/realtime test:integration
      - run: pnpm --filter @rafay-pair/api migrate
      - run: pnpm --filter @rafay-pair/api lint
      - run: pnpm --filter @rafay-pair/api typecheck
      - run: pnpm --filter @rafay-pair/api test
      - run: pnpm --filter @rafay-pair/api test:integration
      - run: pnpm --filter @rafay-pair/worker lint
      - run: pnpm --filter @rafay-pair/worker typecheck
      - run: pnpm --filter @rafay-pair/worker test
      - run: pnpm --filter @rafay-pair/worker test:integration
      - run: pnpm --filter @rafay-pair/api-contracts validate
      - run: pnpm --filter @rafay-pair/api build && pnpm --filter @rafay-pair/worker build

  web:
    name: Web build, unit, accessibility, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_DB: rafay_pair_test
          POSTGRES_USER: rafay_pair
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rafay_pair -d rafay_pair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rafay_pair:test-only-password@127.0.0.1:5432/rafay_pair_test?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      SESSION_PEPPER: ci-web-e2e-session-pepper-with-at-least-32-characters
      EMAIL_TOKEN_PEPPER: ci-web-e2e-email-pepper-with-at-least-32-characters
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rafay-pair/web lint
      - run: pnpm --filter @rafay-pair/web typecheck
      - run: pnpm --filter @rafay-pair/web test
      - run: pnpm --filter @rafay-pair/web build
      # Master specification §17: alert on artifact-size regression. The web
      # job builds these three, so they are required rather than skipped.
      - run: >-
          node scripts/check-artifact-budgets.mjs
          --require=web-initial-javascript,web-pose-worker,web-stylesheet
      - run: ./scripts/report-artifact-sizes.sh reports/web-artifact-sizes.tsv apps/web/dist
      - run: pnpm --filter @rafay-pair/api... build
      - run: pnpm --filter @rafay-pair/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @rafay-pair/web test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-production
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-private-source-maps
          path: apps/web/private-source-maps
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-artifact-sizes
          path: reports/web-artifact-sizes.tsv
          if-no-files-found: error
          retention-days: 90

  ios:
    name: iOS Swift 6 build, unit, UI smoke
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install checksum-pinned XcodeGen
        env:
          XCODEGEN_INSTALL_DIR: ${{ runner.temp }}/xcodegen
        run: |
          ./scripts/install-xcodegen.sh
          echo "$XCODEGEN_INSTALL_DIR/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate
        working-directory: apps/ios
      - name: Swift format lint
        run: ./scripts/lint-ios.sh
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device="$(xcrun simctl list devices available | sed -nE 's/^[[:space:]]+(iPhone[^()]*) \([0-9A-F-]+\).*/\1/p' | head -n 1 | sed 's/[[:space:]]*$//')"
          test -n "$device"
          echo "name=$device" >> "$GITHUB_OUTPUT"
      - name: Test
        run: >-
          xcodebuild
          -project RafayPair.xcodeproj
          -scheme RafayPair
          -configuration Debug
          -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}'
          -resultBundlePath ../../artifacts/ios-tests.xcresult
          test
        working-directory: apps/ios
      - name: Release-mode simulator build
        run: >-
          xcodebuild
          -project RafayPair.xcodeproj
          -scheme RafayPair
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../../artifacts/ios-derived-data
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: apps/ios
      - run: >-
          ./scripts/report-artifact-sizes.sh
          reports/ios-artifact-sizes.tsv
          artifacts/ios-derived-data/Build/Products/Release-iphonesimulator/RafayPair.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-artifact-sizes
          path: reports/ios-artifact-sizes.tsv
          if-no-files-found: error
          retention-days: 90

  android:
    name: Android lint, unit, APK, AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-upload
      - run: >-
          ./gradlew --configuration-cache
          verifyEnvironmentEndpoints
          lintDevelopment
          testDebugUnitTest
          assembleDebug
          assembleDevelopment
          bundleRelease
        env:
          RAFAYPAIR_FIREBASE_APPLICATION_ID: ${{ vars.RAFAYPAIR_FIREBASE_APPLICATION_ID }}
          RAFAYPAIR_FIREBASE_API_KEY: ${{ vars.RAFAYPAIR_FIREBASE_API_KEY }}
          RAFAYPAIR_FIREBASE_PROJECT_ID: ${{ vars.RAFAYPAIR_FIREBASE_PROJECT_ID }}
          RAFAYPAIR_FIREBASE_SENDER_ID: ${{ vars.RAFAYPAIR_FIREBASE_SENDER_ID }}
          RAFAYPAIR_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${{ vars.RAFAYPAIR_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }}
        working-directory: apps/android
      - name: Measure Android artifacts
        run: |
          mapfile -t artifacts < <(find apps/android/app/build/outputs -type f \
            \( -name '*.apk' -o -name '*.aab' -o -name 'mapping.txt' \) -print | sort)
          test "${#artifacts[@]}" -gt 0
          ./scripts/report-artifact-sizes.sh reports/android-artifact-sizes.tsv "${artifacts[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned
          path: |
            apps/android/**/build/outputs/apk/**/*.apk
            apps/android/**/build/outputs/bundle/**/*.aab
            apps/android/**/build/outputs/mapping/**/*.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-artifact-sizes
          path: reports/android-artifact-sizes.tsv
          if-no-files-found: error
          retention-days: 90

  android-instrumented:
    name: Android instrumented smoke
    runs-on: ubuntu-24.04
    needs: [android]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run development instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          working-directory: apps/android
          script: ./gradlew --configuration-cache connectedDevelopmentAndroidTest

  containers:
    name: Production containers
    runs-on: ubuntu-24.04
    needs: [server]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: rafay-pair-api:${{ github.sha }}
          cache-from: type=gha,scope=api-ci
          cache-to: type=gha,mode=max,scope=api-ci
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/arm64
          load: true
          tags: rafay-pair-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker-ci
          cache-to: type=gha,mode=max,scope=worker-ci
      - name: Scan API image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: rafay-pair-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan worker image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: rafay-pair-worker:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Measure container images
        run: |
          mkdir -p reports
          # shellcheck disable=SC2016
          api_bytes="$(docker image inspect --format '{{.Size}}' "rafay-pair-api:$GITHUB_SHA")"
          # shellcheck disable=SC2016
          worker_bytes="$(docker image inspect --format '{{.Size}}' "rafay-pair-worker:$GITHUB_SHA")"
          {
            printf 'artifact\tbytes\n'
            printf 'rafay-pair-api:%s\t%s\n' "$GITHUB_SHA" "$api_bytes"
            printf 'rafay-pair-worker:%s\t%s\n' "$GITHUB_SHA" "$worker_bytes"
          } > reports/container-artifact-sizes.tsv
          {
            printf '### Production container sizes\n\n| Image | Bytes |\n| --- | ---: |\n'
            tail -n +2 reports/container-artifact-sizes.tsv | while IFS=$'\t' read -r image bytes; do
              printf "| \`%s\` | %s |\n" "$image" "$bytes"
            done
            printf '\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: docker save rafay-pair-api:${{ github.sha }} rafay-pair-worker:${{ github.sha }} | gzip > containers.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-containers
          path: containers.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-artifact-sizes
          path: reports/container-artifact-sizes.tsv
          if-no-files-found: error
          retention-days: 90

  infrastructure:
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_DATA_DIR: /tmp/rafay-pair-terraform-data
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

  sast:
    name: SAST (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-24.04
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.language == 'java-kotlin'
      - name: Install checksum-pinned XcodeGen
        if: matrix.language == 'swift'
        env:
          XCODEGEN_INSTALL_DIR: ${{ runner.temp }}/xcodegen
        run: |
          ./scripts/install-xcodegen.sh
          echo "$XCODEGEN_INSTALL_DIR/bin" >> "$GITHUB_PATH"
      - name: Generate the native Xcode project
        if: matrix.language == 'swift'
        run: xcodegen generate
        working-directory: apps/ios
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-configuration-cache clean compileDebugKotlin
        working-directory: apps/android
      - name: Compile Swift for CodeQL
        if: matrix.language == 'swift'
        run: >-
          xcodebuild
          -project RafayPair.xcodeproj
          -scheme RafayPair
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ../../artifacts/codeql-ios-derived-data
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: apps/ios
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}

  security:
    name: Secrets, dependencies, filesystem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
